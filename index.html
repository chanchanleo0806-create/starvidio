<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>STAR VIDEO - Clean Stream</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* 1. 상단바 (지갑/상태) */
        .top-bar { height: 50px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #f6851b; }

        /* 2. 메인 컨텐츠 (좌광고 - 영상 - 우광고) */
        .main-content { flex: 1; display: flex; overflow: hidden; }
        
        .side-ad { width: 160px; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 중앙 영상 구역: 여기서 남의 광고를 가림 */
        .video-core { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
        
        /* iframe이나 video가 들어갈 곳 */
        #player-frame { width: 100%; height: 100%; border: none; }

        /* 3. 하단 고정 광고 */
        .bottom-ad-fixed { height: 90px; background: #1a1a1a; border-top: 2px solid #f6851b; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="top-bar">⭐ STAR VIDEO PREMIUM LIVE</div>

    <div class="main-content">
        <div class="side-ad">
            <iframe data-aa='2435841' src='//acceptable.a-ads.com/2435841/?size=160x600' style='border:0; padding:0; width:160px; height:600px;'></iframe>
        </div>

        <div class="video-core">
            <iframe id="player-frame" src="중계_주소_입력"></iframe>
        </div>

        <div class="side-ad">
            <iframe data-aa='2435841' src='//acceptable.a-ads.com/2435841/?size=160x600' style='border:0; padding:0; width:160px; height:600px;'></iframe>
        </div>
    </div>

    <div class="bottom-ad-fixed">
        <iframe data-aa='2435841' src='//acceptable.a-ads.com/2435841/?size=728x90' style='border:0; padding:0; width:728px; height:90px;'></iframe>
    </div>

</body>
</html>
